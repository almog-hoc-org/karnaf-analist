name: build & deploy

# WHY THIS EXISTS
# Every change reached the server the same way: someone opened a terminal, ran
# `git pull && bash scripts/deploy.sh`, waited, and pasted the output back. That
# is fine once. Across a working session it becomes the bottleneck — and worse,
# it means a fix and its deployment are separate acts that can drift apart, so
# "it is pushed" and "it is live" stop being the same statement.
#
# The assistant writing these changes runs in a container with no route to the
# VPS and, deliberately, no SSH credentials. GitHub is the one place both sides
# can reach. So the push becomes the deploy.
#
# WHAT IT DOES NOT DO
# It does not touch /var/lib/karnaf — the databases live outside the image and
# scripts/deploy.sh backs them up before it starts. It does not restart Traefik
# or the OpenClaw bot sharing the host; deploy.sh checks both are still alive
# afterwards and says so.

on:
  push:
    branches:
      - claude/project-deep-learning-g64ogo
      - main
  # PRs (agent/* branches included) get the BUILD GATE only — the deploy job
  # is push-gated below, so a red/green check appears on the PR and merging
  # is what actually ships.
  pull_request:
    branches:
      - claude/project-deep-learning-g64ogo
      - main
  # Deploy the current branch on demand, without an empty commit. The optional
  # input also runs the full data pipeline on the live DB right after — the one
  # operation push-to-deploy cannot express, needed when a code change alters
  # what the aggregation produces and waiting for the 02:30 nightly means a day
  # of stale stats. It lives here rather than in its own workflow because
  # GitHub only registers dispatchable workflows from the default branch.
  workflow_dispatch:
    inputs:
      run_pipeline:
        description: "אחרי הפריסה: להריץ את ה-pipeline המלא על ה-DB החי ולהדפיס אימות"
        type: boolean
        default: false

# One deploy at a time. Two overlapping runs would race on the same working
# copy and the same container, and the loser leaves the server in a state
# neither commit describes. Not cancel-in-progress: a half-applied deploy is
# worse than a queued one.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  build:
    name: build (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The build reads the database during page-data collection, so it needs a
      # file with the right schema present. Same trick the Dockerfile uses; an
      # empty schema is enough to compile against.
      - name: schema database for the build
        run: |
          mkdir -p data
          npx prisma db push --url="file:$PWD/data/realestate.db" --accept-data-loss

      # THE GATE. A build that fails here never reaches the server, which is the
      # entire point of putting a job in front of the deploy.
      #
      # tsc joined the gate once the type debt was actually paid (it passes
      # clean as of 2026-08). Lint still carries stylistic debt
      # (no-explicit-any and friends) and stays out until that is settled — a
      # gate nobody can pass is a gate everybody learns to bypass.
      - name: build
        run: npm run build

      # After build on purpose: `npm run build` is what runs `prisma generate`,
      # and tsc needs the generated client to exist. Same gate either way — the
      # deploy job waits for this whole job to pass.
      - name: typecheck
        run: npx tsc --noEmit

      # Pure-function tests. Fast enough to be unconditional, and every case in
      # them is a bug this project actually shipped — so a red one here means a
      # regression, not a flake.
      - name: unit tests
        run: npm test

  deploy:
    name: deploy to VPS
    needs: build
    # never deploy from a PR event — the build above is its whole job there
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: ssh in and deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "::error::VPS_HOST / VPS_USER / VPS_SSH_KEY are not set in repository secrets."
            echo "Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Normalise the secret rather than trusting it was pasted clean.
          # A host of "root@1.2.3.4" — the obvious thing to paste — makes
          # ssh-keyscan fail instantly on an invalid hostname, and a trailing
          # \r from a copy-paste breaks the key file the same silent way.
          HOST=$(printf '%s' "$HOST" | tr -d '[:space:]' | sed 's#^[a-zA-Z]*://##; s#^.*@##; s#/*$##')
          USER=$(printf '%s' "$USER" | tr -d '[:space:]')

          # GitHub-hosted runners have no IPv6 route at all. Connecting to a v6
          # address from one fails with ENETUNREACH instantly — which reads as
          # "the server is down" when the server is fine and simply cannot be
          # addressed from here. Worth its own message, because the obvious
          # reading sends you to the VPS to debug nothing.
          #
          # Testing for a colon is safe to print: it says nothing about the
          # address beyond its family, and GitHub masks the value itself.
          case "$HOST" in
            *:*)
              echo "::error::VPS_HOST is an IPv6 address, and GitHub-hosted runners cannot reach IPv6."
              echo "Set VPS_HOST to the server's IPv4 address instead (ssh in and run: curl -4 -s ifconfig.me)."
              exit 1 ;;
          esac

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is not a usable private key."
            echo "Paste the whole thing, BEGIN and END lines included, from deploy/setup-ci-key.sh."
            exit 1
          fi

          # Pin the host key instead of disabling the check. StrictHostKeyChecking=no
          # would hand this deploy to anyone who can answer on that address.
          #
          # NOT 2>/dev/null. The first version of this hid ssh-keyscan's stderr,
          # and when the scan failed the step aborted under `bash -e` with no
          # output at all — a deploy that says nothing about why it did not
          # happen. The error is the whole value of the step failing.
          if ! ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts; then
            echo "::error::ssh-keyscan could not read a host key from VPS_HOST."
            echo "'Network is unreachable' above means the address family has no route from this runner (IPv6)."
            echo "'Connection timed out' means a firewall or a VPS that is down."
            echo "Otherwise check that VPS_HOST is the bare address — no user@, no https://, no port."
            exit 1
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::VPS_HOST answered but offered no host key."
            exit 1
          fi

          ssh -o BatchMode=yes "$USER@$HOST" \
            "cd /opt/karnaf && git fetch --all --prune && git checkout -f '${{ github.ref_name }}' && git reset --hard 'origin/${{ github.ref_name }}' && bash scripts/deploy.sh"

      - name: confirm the site answers
        run: |
          # deploy.sh already health-checks from inside the host. This checks
          # from OUTSIDE, over the public name, which is the only vantage point
          # that proves a visitor can reach it — a container answering on
          # localhost while Traefik routes nowhere looks healthy from within.
          # -L: the legacy hostname 301s to the canonical domain by design —
          # a redirect that lands on 200 is a HEALTHY site, not a failure.
          for i in 1 2 3 4 5; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 https://analyst.karnafnadlan.com/api/health || echo 000)
            [ "$code" = "200" ] && { echo "✓ live (HTTP 200)"; exit 0; }
            echo "attempt $i: HTTP $code — retrying"
            sleep 10
          done
          echo "::error::site did not return 200 after the deploy"
          exit 1


      # Optional third act, workflow_dispatch + run_pipeline only: run the exact
      # command the 02:30 nightly runs, on the container the deploy above just
      # confirmed healthy, and print the verification numbers into this log.
      # SAME JOB as the deploy on purpose: a separate job lands on a fresh
      # runner whose keyscan flaked repeatedly (likely connection rate-limiting
      # on the host) — this step reuses the ssh key and pinned host key the
      # deploy step already proved working from this very runner.
      - name: run data pipeline on VPS
        if: github.event_name == 'workflow_dispatch' && inputs.run_pipeline
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          # key + known_hosts were written by the deploy step on this runner
          HOST=$(printf '%s' "$HOST" | tr -d '[:space:]' | sed 's#^[a-zA-Z]*://##; s#^.*@##; s#/*$##')
          USER=$(printf '%s' "$USER" | tr -d '[:space:]')
          ssh -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -e
          cd /opt/karnaf

          # </dev/null on every docker exec is load-bearing: this script arrives
          # on bash's stdin (bash -s), and `docker compose exec -T` forwards its
          # stdin to the container — without the redirect the first exec swallows
          # the rest of the script and the run "succeeds" having done nothing.

          echo "── urban-renewal collector (fails soft, never destructive) ──"
          docker compose exec -T app npx tsx lib/collect-urban-renewal.ts </dev/null || true

          echo "── full pipeline (same command as the 02:30 nightly) ──"
          # NOT bare, deliberately. The remote script runs under `set -e`, so a
          # failing stage used to abort the SSH session on the spot and every
          # diagnostic below it — the city-page probe, the render census, the
          # verification block — silently never ran. The one run where a stage
          # actually failed was therefore the one run that produced no evidence
          # about anything else. The failure is remembered and re-raised at the
          # end; the diagnostics get to speak first.
          docker compose exec -T app npx tsx scripts/pipeline.ts --trigger=ops-dispatch </dev/null || PIPELINE_FAILED=1

          echo "── city render census (which cities throw, and why) ──"
          docker compose exec -T app npx tsx scripts/diagnose-city-render.ts --all </dev/null || true

          echo "── subsidized-price cells (מחיר למשתכן distortion) ──"
          docker compose exec -T app npx tsx scripts/diagnose-price-anomalies.ts </dev/null || true

          # The census above exercises the LOADERS. A crash in the render itself
          # — a component that throws on a shape only one city produces — is
          # invisible to it, and so is anything past the paywall, since an
          # anonymous fetch stops at the public summary. This renders the real
          # page as a signed-in user over loopback, then prints the container's
          # stderr, which is where the stack behind an opaque digest lives.
          echo "── authenticated city-page probe ──"
          docker compose exec -T app npx tsx scripts/probe-city-page.ts --all </dev/null || PROBE_FAILED=1

          if [ -n "${PROBE_FAILED:-}" ]; then
            echo "── container stderr (the stack behind the digest) ──"
            docker compose logs --tail=200 --no-color app 2>&1 | grep -v "GET /\|POST /" | tail -120
          fi

          echo "── verification ──"
          docker compose exec -T app node -e '
            const Database = require("better-sqlite3");
            const db = new Database("/app/data/realestate.db", { readonly: true });
            const s = db.prepare("SELECT COUNT(*) n, MIN(year) a, MAX(year) b FROM nadlan_year_room_stats").get();
            console.log(`nadlan_year_room_stats: ${s.n} rows, years ${s.a}-${s.b}`);
            try {
              const u = db.prepare("SELECT COUNT(*) n, COUNT(DISTINCT city_name) c FROM urban_renewal_projects").get();
              console.log(`urban_renewal_projects: ${u.n} rows, ${u.c} cities`);
            } catch { console.log("urban_renewal_projects: not created yet (collector skipped)"); }
            try {
              const fs = require("fs");
              const dc = JSON.parse(fs.readFileSync("/app/data/data-contract.json", "utf8"));
              console.log("data-contract ok:", dc.ok, "| raw:", JSON.stringify(dc.raw), "| stats:", JSON.stringify(dc.stats));
              if (dc.problems?.length) console.log("data-contract problems:", dc.problems.join(" ; "));
            } catch { console.log("data-contract.json: not found"); }

            // ── deep checks: the QA city list — stats depth, headline sample sizes ──
            // (string literals go through bind parameters: the container SQLite
            //  rejects double-quoted strings, and this script sits inside a
            //  single-quoted shell string)
            const QA = ["נתניה","בת ים","קריית ביאליק","חיפה","ירושלים","תל אביב","באר שבע","אשדוד","לוד","רעננה","ראש העין","מודיעין","ירוחם"];
            const perCity = db.prepare(`
              SELECT city_name, COUNT(*) cnt, MIN(year) lo, MAX(year) hi,
                     SUM(CASE WHEN scope IN (?,?) AND room_bucket = ? THEN 1 ELSE 0 END) allYears
                FROM nadlan_year_room_stats WHERE city_name LIKE ? GROUP BY city_name`);
            const latestN = db.prepare(`
              SELECT year, scope, n FROM nadlan_year_room_stats
               WHERE city_name = ? AND room_bucket = ? AND scope IN (?,?,?)
               ORDER BY year DESC LIMIT 4`);
            console.log("── QA cities ──");
            for (const q of QA) {
              const rows = perCity.all("all", "all_govmap", "all", `%${q}%`);
              if (!rows.length) { console.log(`  ✗ ${q}: NO STATS AT ALL`); continue; }
              for (const r of rows) {
                const tail = latestN.all(r.city_name, "all", "all", "all_govmap", "secondhand").map((x) => `${x.year} ${x.scope} n=${x.n}`).join(" · ");
                console.log(`  ${r.city_name}: ${r.cnt} rows, ${r.lo}-${r.hi}, all-scope years=${r.allYears} | ${tail}`);
              }
            }
            const alias = db.prepare(`SELECT COUNT(*) n FROM nadlan_transactions WHERE city_name = ?`).get("מכבים רעות");
            console.log(`alias leak (מכבים רעות in raw): ${alias.n}`);
            try {
              const cr = db.prepare(`SELECT COUNT(*) n FROM city_classification_rate`).get();
              console.log(`city_classification_rate: ${cr.n} cities`);
            } catch { console.log("city_classification_rate: MISSING"); }
          ' </dev/null

          echo "── clarity diagnostic ──"
          # The ID is inlined into the client bundle AT BUILD TIME. Chain:
          # .env.production --(deploy.sh: set -a source)--> shell env
          # --(compose ${VAR:-})--> build arg --(Dockerfile ENV)--> npm run build.
          # Compose gives SHELL env precedence over the .env file, so if .env
          # and .env.production disagree, the sourced one wins — print both.
          # The ID itself is public (it ships in every visitor's HTML).
          echo "  file identities:"
          ls -la /opt/karnaf/.env /opt/karnaf/.env.production 2>&1 | sed 's/^/    /'
          echo "  .env clarity lines:";            grep -n -i clarity /opt/karnaf/.env            | sed 's/^/    /' || echo "    (none)"
          echo "  .env.production clarity lines:"; grep -n -i clarity /opt/karnaf/.env.production | sed 's/^/    /' || echo "    (none)"
          echo "  compose would pass NOW (config resolution):"
          docker compose config 2>/dev/null | grep -i clarity | sed 's/^/    /' || echo "    (nothing)"
          echo "  what the RUNNING image was built with (ENV persisted from build arg):"
          docker compose exec -T app sh -c 'printf "    NEXT_PUBLIC_CLARITY_ID=[%s]\n" "$NEXT_PUBLIC_CLARITY_ID"' </dev/null
          echo "  inlined value in the shipped JS (60 chars around clarity.ms):"
          docker compose exec -T app sh -c "grep -rho -m1 -- '.\{0,40\}clarity\.ms.\{0,60\}' /app/.next.nosync/static/chunks 2>/dev/null | head -2" </dev/null | sed 's/^/    /' || true

          # Re-raise the pipeline failure now that everything downstream has
          # reported. The step still fails; it just fails informatively.
          if [ -n "${PIPELINE_FAILED:-}" ]; then
            echo "✗ הצינור נכשל — ראה את שלב הכשל למעלה (הבדיקות שאחריו רצו בכל זאת)"
            exit 1
          fi
          REMOTE

      - name: live page checks from outside
        if: github.event_name == 'workflow_dispatch' && inputs.run_pipeline
        run: |
          check() {  # path, expected marker (fixed string, empty = status only)
            local path="$1" marker="$2"
            local url="https://analyst.karnafnadlan.com${path}"
            local body code
            body=$(curl -sL --max-time 30 "$url") || { echo "✗ $path — fetch failed"; FAIL=1; return; }
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)
            if [ "$code" != "200" ]; then echo "✗ $path — HTTP $code"; FAIL=1; return; fi
            if [ -n "$marker" ] && ! printf '%s' "$body" | grep -qF -- "$marker"; then
              echo "✗ $path — 200 but marker \"$marker\" not found"; FAIL=1; return
            fi
            echo "✓ $path"
          }
          FAIL=0
          check "/" "קרנף"
          check "/cities" ""
          check "/compare" ""
          check "/calculators" ""
          check "/deals" ""
          check "/methodology" ""
          check "/sources" ""
          echo "── SEO surfaces (must exist and carry real content) ──"
          sm=$(curl -sL --max-time 30 https://analyst.karnafnadlan.com/sitemap.xml)
          urls=$(printf '%s' "$sm" | grep -c "<loc>" || true)
          echo "sitemap.xml URLs: ${urls}"
          [ "${urls:-0}" -gt 100 ] && echo "✓ sitemap has the city long tail" || { echo "✗ sitemap too small"; FAIL=1; }
          curl -sL --max-time 20 https://analyst.karnafnadlan.com/robots.txt | head -5
          # A city page, as an ANONYMOUS visitor: the public summary must be
          # present (h1 with the query) and the paid depth must NOT be.
          city=$(curl -sL --max-time 30 "https://analyst.karnafnadlan.com/city/%D7%A0%D7%AA%D7%A0%D7%99%D7%94")
          printf '%s' "$city" | grep -q "מחירי דירות ב" && echo "✓ public summary rendered for anonymous" || { echo "✗ no public summary"; FAIL=1; }
          printf '%s' "$city" | grep -q "MultiChartStudio\|סטודיו הגרפים" && { echo "✗ gated depth leaked to anonymous"; FAIL=1; } || echo "✓ paid depth still gated"
          og=$(curl -sL -o /dev/null -w '%{http_code} %{content_type}' --max-time 45 "https://analyst.karnafnadlan.com/city/%D7%A0%D7%AA%D7%A0%D7%99%D7%94/opengraph-image")
          echo "OG image: $og"
          printf '%s' "$og" | grep -q "200 image/png" && echo "✓ OG card renders" || { echo "✗ OG card failed"; FAIL=1; }

          echo "── clarity in the shipped bundle (what a visitor's browser gets) ──"
          html=$(curl -sL --max-time 30 https://analyst.karnafnadlan.com/)
          chunk=$(printf '%s' "$html" | grep -o '/_next/static/chunks/app/layout-[^"]*\.js' | head -1)
          echo "layout chunk: ${chunk:-NOT FOUND IN HTML}"
          if [ -n "$chunk" ]; then
            js=$(curl -sL --max-time 30 "https://analyst.karnafnadlan.com$chunk")
            printf '%s' "$js" | grep -q 'clarity\.ms' && echo "✓ clarity loader in shipped JS" || { echo "✗ clarity loader NOT in shipped JS"; FAIL=1; }
            printf '%s' "$js" | grep -q 'xwkhx8p1bs' && echo "✓ project id xwkhx8p1bs in shipped JS" || { echo "✗ project id NOT in shipped JS"; FAIL=1; }
          fi
          echo "── /api/status ──"
          curl -sL --max-time 30 https://analyst.karnafnadlan.com/api/status | head -c 2000; echo
          exit $FAIL
