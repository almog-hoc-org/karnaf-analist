name: ops · run data pipeline

# WHY THIS EXISTS
# The one operation the push-to-deploy loop cannot express: running the data
# pipeline on the LIVE database right now, instead of waiting for the nightly
# timer at 02:30. The assistant's container has no route to the VPS — GitHub
# is the meeting point, exactly as with deploy.yml — so "rebuild the stats"
# becomes a button here (and a remote dispatch for the agent).
#
# It reuses the deploy secrets and the same SSH hygiene as deploy.yml, runs
# the identical command the nightly systemd unit runs, and then prints the
# verification numbers (stats row count, year range, data-contract summary)
# into the job log, where both the operator and the agent can read them.

on:
  workflow_dispatch:

# Same lock as deploy.yml ON PURPOSE: the pipeline runs inside the app
# container, and a deploy swapping that container mid-run would kill the
# aggregation half-way. Sharing the group means this queues behind any
# in-flight deploy instead of racing it.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  pipeline:
    name: collect + pipeline + verify on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: ssh in and run the pipeline
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "::error::VPS_HOST / VPS_USER / VPS_SSH_KEY are not set in repository secrets."
            exit 1
          fi

          # Same normalisation + host-key pinning as deploy.yml — see the
          # comments there for why each line exists.
          HOST=$(printf '%s' "$HOST" | tr -d '[:space:]' | sed 's#^[a-zA-Z]*://##; s#^.*@##; s#/*$##')
          USER=$(printf '%s' "$USER" | tr -d '[:space:]')
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is not a usable private key."
            exit 1
          fi
          if ! ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts; then
            echo "::error::ssh-keyscan could not read a host key from VPS_HOST."
            exit 1
          fi

          ssh -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -e
          cd /opt/karnaf

          echo "── urban-renewal collector (fails soft, never destructive) ──"
          docker compose exec -T app npx tsx lib/collect-urban-renewal.ts || true

          echo "── full pipeline (same command as the 02:30 nightly) ──"
          docker compose exec -T app npx tsx scripts/pipeline.ts --trigger=ops-workflow

          echo "── verification ──"
          docker compose exec -T app node -e '
            const Database = require("better-sqlite3");
            const db = new Database("/app/data/realestate.db", { readonly: true });
            const s = db.prepare("SELECT COUNT(*) n, MIN(year) a, MAX(year) b FROM nadlan_year_room_stats").get();
            console.log(`nadlan_year_room_stats: ${s.n} rows, years ${s.a}-${s.b}`);
            try {
              const u = db.prepare("SELECT COUNT(*) n, COUNT(DISTINCT city_name) c FROM urban_renewal_projects").get();
              console.log(`urban_renewal_projects: ${u.n} rows, ${u.c} cities`);
            } catch { console.log("urban_renewal_projects: not created yet (collector skipped)"); }
            try {
              const fs = require("fs");
              const dc = JSON.parse(fs.readFileSync("/app/data/data-contract.json", "utf8"));
              console.log("data-contract ok:", dc.ok, "| raw:", JSON.stringify(dc.raw), "| stats:", JSON.stringify(dc.stats));
              if (dc.problems?.length) console.log("data-contract problems:", dc.problems.join(" ; "));
            } catch { console.log("data-contract.json: not found"); }
          '
          REMOTE

      - name: confirm the site still answers
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 https://analyst.karnafnadlan.com/api/health || echo 000)
            [ "$code" = "200" ] && { echo "✓ live (HTTP 200)"; exit 0; }
            echo "attempt $i: HTTP $code — retrying"
            sleep 10
          done
          echo "::error::site did not return 200 after the pipeline run"
          exit 1
