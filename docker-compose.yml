# Karnaf Analist — deployment for the Hostinger VPS.
#
# CONTEXT THIS IS WRITTEN AGAINST
# The server already runs two things that must not be disturbed:
#   1. an OpenClaw bot, as a bare host process on port 18789
#   2. Traefik, in host network mode, owning :80 and :443 and issuing
#      Let's Encrypt certificates
#
# NOTHING HERE MODIFIES EITHER. Traefik is configured with
# `--providers.docker=true` and `--providers.docker.exposedbydefault=false`,
# which means it discovers containers by itself but only ones that opt in. The
# labels below are that opt-in. Traefik's own compose file is never touched.
#
# The app does NOT publish a port to the host. Traefik reaches it over the
# Docker bridge network, so nothing new is exposed to the internet and there is
# no chance of colliding with the bot.

services:
  app:
    build:
      context: .
      args:
        # Empty = served at the domain root. Set to /analist ONLY when moving
        # under karnafnadlan.com/analist — it is inlined at build time, so
        # changing it requires a rebuild, not just a restart.
        NEXT_PUBLIC_BASE_PATH: "${NEXT_PUBLIC_BASE_PATH:-}"
        # Also build-time — see the note in the Dockerfile. Changing it in
        # .env.production requires `bash scripts/deploy.sh`, not a restart.
        NEXT_PUBLIC_CLARITY_ID: "${NEXT_PUBLIC_CLARITY_ID:-}"
    image: karnaf-analist:latest
    container_name: karnaf-analist
    restart: unless-stopped

    env_file:
      - .env.production

    volumes:
      # ── THE IMPORTANT PART ──────────────────────────────────────────
      # Databases live on the HOST, outside the image. The container is
      # disposable and gets rebuilt on every deploy; this directory is not.
      # Without this split, a deploy would silently destroy 1.35M transactions
      # and every user account.
      - /var/lib/karnaf/data:/app/data
      # Report PDFs the refresh pipeline downloads, served from public/.
      - /var/lib/karnaf/reports:/app/public/reports

    # ── RESOURCE LIMITS: THIS IS WHAT PROTECTS THE BOT ────────────────
    # The aggregation step loads roughly a million rows into a JavaScript array.
    # On a 7.8GB box that also hosts the bot (~560MB) plus Traefik and Docker,
    # an unbounded spike could get the bot OOM-killed. A hard ceiling means the
    # worst case is OUR container dying and restarting — never the bot.
    # ONE form only. Setting both `deploy.resources.limits` and the legacy
    # top-level keys (mem_limit / cpus) makes Compose refuse the file outright:
    # "can't set distinct values on 'cpus' and 'deploy.resources.limits.cpus'".
    # Compose v2 applies deploy.resources outside Swarm, so this is the modern
    # form and the legacy keys are gone.
    #
    # No memswap limit is needed: this server has no swap configured at all
    # (`free -h` shows 0B), so the memory ceiling cannot leak into it.
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "1.5"      # of 2 cores — leaves headroom for the bot
        reservations:
          memory: 512M

    labels:
      # ── Traefik opt-in ──────────────────────────────────────────────
      - "traefik.enable=true"
      # Which hostname routes here. Override APP_HOST in .env.production.
      - "traefik.http.routers.karnaf.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.karnaf.entrypoints=websecure"
      - "traefik.http.routers.karnaf.tls=true"
      # Must match the resolver name in Traefik's own command line, or no
      # certificate is issued and the site serves a browser warning.
      - "traefik.http.routers.karnaf.tls.certresolver=letsencrypt"
      - "traefik.http.services.karnaf.loadbalancer.server.port=3000"
      # NO traefik.docker.network label on purpose. That label names the network
      # Traefik should use to reach the container, and it is only needed when a
      # container sits on several. This one sits on exactly one — the network
      # compose creates for this project — so Traefik resolves it by itself.
      # Naming a network the container is NOT on (e.g. the default "bridge")
      # makes Traefik look up an address that does not exist and answer 404.

    logging:
      # Logs are useful and also grow forever. 3×10MB is plenty to debug a bad
      # deploy without quietly eating the disk.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
